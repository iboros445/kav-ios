name: iOS

on:
  push:
    branches: ['**']
    tags: ['ios-v*']
  workflow_dispatch:

permissions:
  contents: write   # the SideStore source release

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # CoreLocation's module map autolinks the private framework `_LocationEssentials`, which the Xcode 16 SDKs no longer
      # ship as a file (the simulator runtime still provides it). The linker only needs a stub to resolve the name.
      - name: Stub for the autolinked _LocationEssentials framework
        working-directory: .
        run: |
          d="$RUNNER_TEMP/kav-framework-stubs/_LocationEssentials.framework"
          mkdir -p "$d"
          cat > "$d/_LocationEssentials.tbd" <<'EOF'
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64-ios-simulator, x86_64-ios-simulator ]
          install-name:    '/System/Library/PrivateFrameworks/_LocationEssentials.framework/_LocationEssentials'
          current-version: 1
          exports:         []
          ...
          EOF
          echo "KAV_FRAMEWORK_STUBS=$RUNNER_TEMP/kav-framework-stubs" >> "$GITHUB_ENV"

      - name: Upstream version
        id: ver
        working-directory: .
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Upstream versionName: $v"

      # The MOT timetable has no licence, so it is never committed: take il.kav out of upstream's release APK.
      - name: Fetch il.kav from the upstream release APK
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ios/app/assets
          tmp=$(mktemp -d)
          gh release download --repo ImNoammm/kav --pattern '*.apk' --dir "$tmp"
          unzip -p "$tmp"/*.apk assets/il.kav > ios/app/assets/il.kav
          ls -l ios/app/assets/il.kav

      - name: Bundle the map style, fonts and sprites
        working-directory: .
        run: |
          mkdir -p ios/app/assets
          cp -R android/app/src/main/assets/map ios/app/assets/map
          cp .github/icon.png ios/app/assets/icon.png

      # compile errors first and alone, so a failed run says why in a few lines
      # Device target first: the link below reuses this compile (the simulator one waits for the tests at the end).
      - name: Compile Kotlin
        run: ./gradlew :kav:compileKotlinIosArm64 --console=plain

      # The release link (LLVM whole-program optimisation) takes ~14 minutes; debug takes a fraction of that, so branch
      # builds ship a debug framework (readable Kotlin stack traces too). Tagged ios-v* releases stay optimised.
      - name: Link the Kotlin framework (device)
        id: fw
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then v=Release; else v=Debug; fi
          echo "variant=$(echo $v | tr '[:upper:]' '[:lower:]')Framework" >> "$GITHUB_OUTPUT"
          ./gradlew ":kav:link${v}FrameworkIosArm64" --console=plain

      - name: App icon from .github/icon.png
        working-directory: .
        run: |
          out=ios/app/Kav/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          # iOS rejects icons with an alpha channel: a JPEG round trip drops it.
          sips -s format jpeg -z 1024 1024 .github/icon.png --out "$RUNNER_TEMP/icon.jpg"
          sips -s format png "$RUNNER_TEMP/icon.jpg" --out "$out"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec app/project.yml --project app

      - name: Build the unsigned app
        working-directory: ios/app
        run: |
          xcodebuild -project Kav.xcodeproj -scheme Kav -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION='${{ steps.ver.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            KAV_FRAMEWORK_VARIANT='${{ steps.fw.outputs.variant }}' \
            build

      - name: Package Kav.ipa
        working-directory: ios/app
        run: |
          rm -rf Payload Kav.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Kav.app Payload/
          zip -qry Kav.ipa Payload
          ls -l Kav.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kav-ipa
          path: ios/app/Kav.ipa
          if-no-files-found: error

      # SideStore source: every build of the iOS branch replaces the IPA on the rolling `ios-nightly` release and
      # rewrites source.json next to it, so SideStore → Sources can install and update Kav without a computer.
      # Source URL: https://github.com/iboros445/kav-ios/releases/download/ios-nightly/source.json
      - name: Publish to the SideStore source
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/ios-migration-plan-4ojstt'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-nightly
        run: |
          ipa="Kav-${{ steps.ver.outputs.version }}-${{ github.run_number }}.ipa"
          cp app/Kav.ipa "$RUNNER_TEMP/$ipa"
          notes="Build ${{ github.run_number }}: $(git log -1 --format=%s)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Kav for iPhone (latest build)" \
              --notes "Rolling development build. Add the source in SideStore: https://github.com/${{ github.repository }}/releases/download/$TAG/source.json"
          fi
          # IPA first, then the source that points at it, then drop older IPAs
          gh release upload "$TAG" "$RUNNER_TEMP/$ipa" --clobber
          python3 tools/make_source_json.py --ipa app/Kav.ipa \
            --url "https://github.com/${{ github.repository }}/releases/download/$TAG/$ipa" \
            --notes "$notes" > "$RUNNER_TEMP/source.json"
          gh release upload "$TAG" "$RUNNER_TEMP/source.json" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^Kav-.*\.ipa$' | grep -vxF "$ipa" \
            | xargs -r -n1 gh release delete-asset "$TAG" -y

      # Last on purpose: linking the test binary takes ~9 minutes, and the IPA above must not wait for it.
      - name: Kotlin simulator tests
        timeout-minutes: 25
        env:
          # simctl hands SIMCTL_CHILD_* to the simulated process with the prefix removed
          SIMCTL_CHILD_KAV_ASSETS_DIR: ${{ github.workspace }}/ios/app/assets
        run: ./gradlew :kav:iosSimulatorArm64Test --console=plain
