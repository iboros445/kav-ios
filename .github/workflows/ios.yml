name: iOS

# Builds run for pushes to the iOS branches (a commit that changes no code says [skip ci]). Manual runs can add the
# simulator tests.
on:
  push:
    branches: ['sync/**', 'claude/ios-migration-plan-4ojstt']
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      tests:
        description: Run the Kotlin simulator tests too (~10 more macOS minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # ~/.konan holds the toolchain and, after a debug link, the per-library caches (Compose, Material, icons...).
      # Building those caches takes ~6 minutes, so the key follows every Gradle file and the cache is saved right
      # after the link (below) instead of at the end of the job. An exact hit skips the save.
      - name: Restore the Kotlin/Native toolchain and library caches
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-v2-${{ runner.os }}-${{ hashFiles('ios/**/*.gradle.kts', 'ios/gradle.properties', 'ios/gradle/wrapper/*.properties') }}
          restore-keys: |
            konan-v2-${{ runner.os }}-
            konan-${{ runner.os }}-

      # CoreLocation's module map autolinks the private framework `_LocationEssentials`, which the Xcode 16 SDKs no longer
      # ship as a file (the simulator runtime still provides it). The linker only needs a stub to resolve the name.
      - name: Stub for the autolinked _LocationEssentials framework
        working-directory: .
        run: |
          d="$RUNNER_TEMP/kav-framework-stubs/_LocationEssentials.framework"
          mkdir -p "$d"
          cat > "$d/_LocationEssentials.tbd" <<'EOF'
          --- !tapi-tbd
          tbd-version:     4
          targets:         [ arm64-ios, arm64-ios-simulator, x86_64-ios-simulator ]
          install-name:    '/System/Library/PrivateFrameworks/_LocationEssentials.framework/_LocationEssentials'
          current-version: 1
          exports:         []
          ...
          EOF
          echo "KAV_FRAMEWORK_STUBS=$RUNNER_TEMP/kav-framework-stubs" >> "$GITHUB_ENV"

      - name: Upstream version
        id: ver
        working-directory: .
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Upstream versionName: $v"

      # The app downloads the timetable at setup (upstream's nightly `timetable` release); the simulator tests read
      # a copy from the test assets. It has no licence, so it is never committed.
      - name: Fetch il.kav for the tests
        if: inputs.tests
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ios/app/assets
          gh release download timetable --repo ImNoammm/kav --pattern 'il.kav.gz' --dir "$RUNNER_TEMP"
          gunzip -c "$RUNNER_TEMP/il.kav.gz" > ios/app/assets/il.kav
          ls -l ios/app/assets/il.kav

      - name: Bundle the map style, fonts and sprites
        working-directory: .
        run: |
          mkdir -p ios/app/assets
          cp -R android/app/src/main/assets/map ios/app/assets/map
          cp .github/icon.png ios/app/assets/icon.png
          # res/raw (notices, release notes, the Moovit scripts) as assets/raw/<file>: see the R and Resources shims.
          mkdir -p ios/app/assets/raw
          cp android/app/src/main/res/raw/* ios/app/assets/raw/
          # Other assets upstream reads by name (report.js for the ministry's form, and any added later).
          find android/app/src/main/assets -maxdepth 1 -type f -exec cp {} ios/app/assets/ \;

      # compile errors first and alone, so a failed run says why in a few lines
      # Device target first: the link below reuses this compile (the simulator one waits for the tests at the end).
      - name: Compile Kotlin
        run: ./gradlew :kavkit:compileKotlinIosArm64 --console=plain

      # The release link (LLVM whole-program optimisation) takes ~14 minutes; debug takes a fraction of that, so branch
      # builds ship a debug framework (readable Kotlin stack traces too). Tagged ios-v* releases stay optimised.
      - name: Link the Kotlin framework (device)
        id: fw
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then v=Release; else v=Debug; fi
          echo "variant=$(echo $v | tr '[:upper:]' '[:lower:]')Framework" >> "$GITHUB_OUTPUT"
          ./gradlew ":kavkit:link${v}FrameworkIosArm64" --console=plain

      # What Swift sees of KavKit (only the entry point and the map seam), for reading Swift compile errors.
      - name: KavKit header
        continue-on-error: true
        run: grep -vE '^\s*$' kavkit/build/bin/iosArm64/${{ steps.fw.outputs.variant }}/KavKit.framework/Headers/KavKit.h

      - name: Save the Kotlin/Native toolchain and library caches
        if: steps.konan.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

      - name: App icon from .github/icon.png
        working-directory: .
        run: |
          out=ios/app/Kav/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          # iOS rejects icons with an alpha channel: a JPEG round trip drops it.
          sips -s format jpeg -z 1024 1024 .github/icon.png --out "$RUNNER_TEMP/icon.jpg"
          sips -s format png "$RUNNER_TEMP/icon.jpg" --out "$out"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec app/project.yml --project app

      - name: Build the unsigned app
        working-directory: ios/app
        run: |
          xcodebuild -project Kav.xcodeproj -scheme Kav -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION='${{ steps.ver.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            KAV_FRAMEWORK_VARIANT='${{ steps.fw.outputs.variant }}' \
            build

      - name: Package Kav.ipa
        working-directory: ios/app
        run: |
          rm -rf Payload Kav.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Kav.app Payload/
          zip -qry Kav.ipa Payload
          ls -l Kav.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kav-ipa
          path: ios/app/Kav.ipa
          if-no-files-found: error
          # Each IPA is ~30 MB; keep only recent ones so artifact storage stays small.
          retention-days: 3

      # Last on purpose: linking the test binary takes ~9 minutes, and the IPA above must not wait for it.
      - name: Kotlin simulator tests
        if: inputs.tests
        timeout-minutes: 25
        env:
          # simctl hands SIMCTL_CHILD_* to the simulated process with the prefix removed
          SIMCTL_CHILD_KAV_ASSETS_DIR: ${{ github.workspace }}/ios/app/assets
        run: ./gradlew :kav:iosSimulatorArm64Test --console=plain
