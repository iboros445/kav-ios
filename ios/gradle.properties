org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
# Lets the build configure on Linux, where Kotlin/Native cannot target iOS. Real compiles run on macOS in CI.
kotlin.native.ignoreDisabledTargets=true
# How much of the upstream Android source is compiled into the iOS framework:
#   none = nothing (Phase 0 spike only)  data = data/ + ui/Strings.kt + ui/Theme.kt (Phase 1)  all = everything (Phase 2+)
kav.upstreamScope=none
