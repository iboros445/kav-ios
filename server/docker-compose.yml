# Runs next to the other stacks on the server, behind Nginx Proxy Manager and Cloudflare.
# .env holds MOT_KEY, MOT_URL, MOT_URL_BACKUP and KAV_APP_KEY; mot-ca.pem is the intermediate certificate
# the ministry leaves out of its chain (GeoTrust TLS RSA CA G1).
services:
  kav-live:
    image: python:3.12-slim
    container_name: kav-live
    restart: unless-stopped
    command: python3 -u /app/live.py
    env_file: .env
    environment:
      - MOT_CA=/app/mot-ca.pem
      - PORT=8080
      - PYTHONDONTWRITEBYTECODE=1
      - HISTORY=/history
      - REALTIME=/realtime
      - ETA=/eta/now.json
      # The second planner, whose routes come after Kav's own; unset, it is not asked.
      - OFFICIAL_URL=http://kav-otp-official:8080/otp/gtfs/v1
      # Line alerts for the app (alerts.py): the ministry's GTFS-Realtime feed, with the same key as its live times.
      - ALERTS_SOURCE=gtfsrt
      - ALERTS_URL=https://moran.mot.gov.il/Channels/HTTPChannel/DeveloperQuery/SpecialMessages?Key=${MOT_KEY}
      # Their English, from kav-translate, each text once.
      - TRANSLATE_URL=http://kav-translate:5000
      - TRANSLATIONS=/history/translations.sqlite3
    volumes:
      - ./live.py:/app/live.py:ro
      - ./alerts.py:/app/alerts.py:ro
      - ./mot-ca.pem:/app/mot-ca.pem:ro
      # When each bus passed each stop, kept ten weeks for the planner's predicted times.
      - ./history:/history
      # The planner's live updates, and the route directions they name trips by.
      - ./otp/realtime:/realtime
      # Kav's own predicted arrivals (kav-eta), which the planner and the app get instead of the ministry's.
      - ./eta/out:/eta:ro
    user: "1000:1000"
    read_only: true
    mem_limit: 1g
    logging:
      options:
        max-size: 1m
        max-file: "2"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live/v1/status', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [proxy-net, kav-net]

  # The trip planner: OpenTripPlanner on the ministry's timetable and OpenStreetMap, rebuilt every night by
  # otp/rebuild.sh. Only kav-live reaches it.
  kav-otp:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: kav-otp
    restart: unless-stopped
    # Kav's linking patch (otp/patch, built by its build.sh) goes first on the classpath: a search's point is joined on
    # foot to every street within kav.walkLinkBand meters of the nearest one, not the nearest alone (0 turns it off).
    entrypoint: ["bash", "-c", "exec java $$JAVA_OPTS -cp /kav-patch:$$(cat /app/jib-classpath-file) $$(cat /app/jib-main-class-file) /var/opentripplanner/ --load --serve"]
    command: []
    environment:
      - JAVA_OPTS=-Xmx4g -Dkav.walkLinkBand=30
    volumes:
      - ./otp/data/serve:/var/opentripplanner
      - ./otp/realtime:/var/opentripplanner/realtime:ro
      - ./otp/patch/classes:/kav-patch:ro
    user: "1000:1000"
    mem_limit: 6g
    cpus: 4
    logging:
      options:
        max-size: 1m
        max-file: "2"
    networks: [kav-net]

  # The second planner: the same, on the ministry's own times (the timetable before otp/predict.py), rebuilt every night
  # by otp/official-build.sh. Only kav-live reaches it.
  kav-otp-official:
    image: opentripplanner/opentripplanner:2.10.0
    container_name: kav-otp-official
    restart: unless-stopped
    command: ["--load", "--serve"]
    environment:
      - JAVA_OPTS=-Xmx4g
    volumes:
      - ./otp/data/serve-official:/var/opentripplanner
      - ./otp/realtime:/var/opentripplanner/realtime:ro
    user: "1000:1000"
    mem_limit: 6g
    cpus: 2
    logging:
      options:
        max-size: 1m
        max-file: "2"
    networks: [kav-net]

  # Kav's own predicted bus arrivals (eta/eta.py), every 30 seconds, from kav-live's history, for kav-live to give the
  # planner and the app; also a log beside the ministry's own times, to keep scoring them. Building each day's history
  # medians takes a few GB for a minute or two, at midnight.
  kav-eta:
    build: ./eta
    image: kav-eta
    container_name: kav-eta
    restart: unless-stopped
    # polars can't check that the history it joins on is in order; it is (inputs.py sorts it), and says so every round.
    command: python3 -u -W ignore::UserWarning /app/eta.py
    environment:
      - KAV_APP_KEY=${KAV_APP_KEY}
      - HISTORY=/history
      - BACKFILL=/backfill
      - GTFS=/official/mot-gtfs.zip
      # The lab's live5: live3_all fine-tuned with each bus's motion (eta/motion.py), and beside it the
      # same fine-tune without, for the buses whose motion can't be told.
      - MODEL=/models/live5_motion.npz
      - MODEL_FALLBACK=/models/live5_control.npz
      - RAIL=/models/rail
      # Trains and Tel Aviv light rail beat the ministry's own times too.
      - RAIL_HANDOVER=2,22
      - REALTIME=/realtime
      - OUT=/eta
      - KAV_LIVE=http://kav-live:8080
      - SPECIAL_DAYS=/special-days.txt
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./eta/eta.py:/app/eta.py:ro
      - ./eta/inputs.py:/app/inputs.py:ro
      - ./eta/motion.py:/app/motion.py:ro
      - ./eta/rail_inputs.py:/app/rail_inputs.py:ro
      - ./history:/history:ro
      # Older days replayed from Hasadna's archive, for the six weeks of medians until kav-live has recorded them.
      - ./eta/history-backfill:/backfill:ro
      # The ministry's own timetable, which otp/prepare.py keeps.
      - ./otp/data/official:/official:ro
      # The planner's special days (otp/predict.py writes it in place), when Kav's times go the special day's way.
      - ./otp/data/special-days.txt:/special-days.txt:ro
      - ./eta/models:/models:ro
      # Where kav-live lists the journeys on the road.
      - ./otp/realtime:/realtime:ro
      - ./eta/out:/eta
      # Where polars spills to disk when memory runs short (it takes /var/tmp, whatever POLARS_TEMP_DIR says): on a
      # read-only system the first spill fails and every later one panics.
      - ./eta/spill:/var/tmp
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 8g
    cpus: 4
    logging:
      options:
        max-size: 1m
        max-file: "2"
    networks: [kav-net]

  # Hebrew to English for the alerts (translate.py, OPUS-MT's model in the image), for kav-live alone. The image is the
  # self-hosted kit's (server/selfhost/translate).
  kav-translate:
    image: ghcr.io/imnoammm/kav-translate:latest
    container_name: kav-translate
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    mem_limit: 1g
    logging:
      options:
        max-size: 1m
        max-file: "2"
    networks: [kav-net]

networks:
  proxy-net:
    external: true
  kav-net:
    internal: true
